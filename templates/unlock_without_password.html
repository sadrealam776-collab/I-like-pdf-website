<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlock PDF Without Password - LikePDF</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon.png?v=3">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-['Plus_Jakarta_Sans'] min-h-screen flex flex-col justify-between">

    <header class="w-full px-6 py-4 border-b border-slate-800 flex items-center justify-between">
        <a href="/" class="flex items-center gap-2 text-sky-400 font-bold text-lg">
            <i class="fa-solid fa-file-pdf"></i> LikePDF
        </a>
        <a href="/" class="text-xs text-slate-400 hover:text-white transition">All Tools</a>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center px-4 py-12">
        <div class="max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl text-center">
            <div class="w-14 h-14 bg-sky-500/10 text-sky-400 rounded-xl flex items-center justify-center text-2xl mx-auto mb-4 border border-sky-500/20">
                <i class="fa-solid fa-lock-open"></i>
            </div>
            <h1 class="text-xl font-bold text-white mb-2">Unlock PDF Without Password</h1>
            <p class="text-slate-400 text-xs mb-6">Remove owner/permission restrictions, printing locks, and empty passwords instantly.</p>

            <form id="unlockForm" class="space-y-4">
                <input type="file" id="pdfFile" name="file" accept=".pdf" class="hidden" required onchange="handleFileSelected(this)">
                
                <label for="pdfFile" id="dropLabel" class="block w-full border-2 border-dashed border-slate-700 hover:border-sky-500 py-8 px-4 rounded-xl cursor-pointer transition">
                    <i class="fa-solid fa-cloud-arrow-up text-2xl text-slate-500 mb-2 block"></i>
                    <span id="selectedFileName" class="text-xs text-slate-300 font-semibold">Click to select PDF file</span>
                </label>

                <button type="submit" id="unlockBtn" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold text-xs py-3 rounded-xl transition shadow-lg disabled:opacity-50" disabled>
                    Unlock & Download PDF
                </button>
            </form>

            <div id="statusMsg" class="mt-4 text-xs font-semibold hidden"></div>
        </div>
    </main>

    <footer class="py-4 text-center text-[11px] text-slate-600 border-t border-slate-900">
        © LikePDF - All Rights Reserved.
    </footer>

    <script>
        function handleFileSelected(input) {
            if (input.files && input.files[0]) {
                document.getElementById('selectedFileName').textContent = input.files[0].name;
                document.getElementById('unlockBtn').disabled = false;
            }
        }

        document.getElementById('unlockForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const fileInput = document.getElementById('pdfFile');
            if (!fileInput.files[0]) return;

            const btn = document.getElementById('unlockBtn');
            const status = document.getElementById('statusMsg');

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Unlocking...`;
            status.classList.add('hidden');

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            fetch('/api/unlock-without-password', {
                method: 'POST',
                body: formData
            })
            .then(async response => {
                if (!response.ok) {
                    const err = await response.json().catch(() => ({}));
                    throw new Error(err.error || "Failed to unlock document");
                }
                return response.blob();
            })
            .then(blob => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `unlocked_${fileInput.files[0].name}`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);

                btn.disabled = false;
                btn.innerHTML = `Unlock & Download PDF`;
                status.className = "mt-4 text-xs font-semibold text-emerald-400";
                status.textContent = "PDF successfully unlocked and downloaded!";
                status.classList.remove('hidden');
            })
            .catch(err => {
                btn.disabled = false;
                btn.innerHTML = `Unlock & Download PDF`;
                status.className = "mt-4 text-xs font-semibold text-red-400";
                status.textContent = err.message;
                status.classList.remove('hidden');
            });
        });
    </script>
</body>
</html>
